[project]
name = "orbis-contracts"
version = "0.1.0"
description = "Versioned asynchronous contracts shared by Orbis services."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11.0",
  "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbis_contracts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
