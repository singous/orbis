[project]
name = "orbis-user-api"
version = "0.1.0"
description = "User API service for Orbis."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.0",
  "pyjwt>=2.10.0",
  "pydantic-settings>=2.9.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.40",
  "uuid6>=2024.7.10",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
