map $http_x_forwarded_proto $orbis_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orbis_api http://api:9201;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $orbis_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $orbis_api;
    }

    location ~ ^/(s(?:/|$)|public/|robots\.txt$|openapi\.json$) {
        proxy_pass $orbis_api;
    }

    location /assets/ {
        try_files $uri @api_assets;
    }

    location @api_assets {
        proxy_pass $orbis_api;
    }

    location /drawing-assets/ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
