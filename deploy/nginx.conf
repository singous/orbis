map $http_x_forwarded_proto $orbis_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_upgrade $orbis_upgrade_connection {
    default upgrade;
    '' close;
}

# Capability paths and all query strings are excluded from access logs.
map $uri $orbis_log_path {
    default $uri;
    ~^/api/v1/public/shares/ /api/v1/public/shares/[redacted];
    ~^/share/ /share/[redacted];
    ~^/(invite|ownership-transfer)/ /confirmation/[redacted];
}
# Nginx error messages can include raw capability paths; use application diagnostics and access statuses.
error_log /dev/null;
log_format orbis '$remote_addr - [$time_local] '
                 '"$request_method $orbis_log_path $server_protocol" $status $body_bytes_sent request_id=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log orbis;
    client_max_body_size 1025m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orbis_api http://api:9202;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $orbis_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/api/v1/workspaces/[^/]+/documents/[^/]+/collaboration/socket$ {
        proxy_pass $orbis_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $orbis_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orbis_upgrade_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $orbis_api;
        proxy_read_timeout 45s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(s(?:/|$)|public/sites/|robots\.txt$|openapi\.json$) {
        proxy_pass $orbis_api;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /drawing-assets/ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
