[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbis-cli"
version = "0.1.0"
description = "Composable remote online document library commands for Orbis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["keyring>=25.0"]

[project.scripts]
orbis = "orbis_cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
