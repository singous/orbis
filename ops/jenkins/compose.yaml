name: orbis-jenkins

services:
  controller:
    image: orbis/jenkins-controller:2.580.1
    build:
      context: .
      dockerfile: controller.Dockerfile
    user: "${ORBIS_UID:-1000}:${ORBIS_GID:-1000}"
    ports:
      - "0.0.0.0:${JENKINS_PORT:-28200}:8080"
    environment:
      JAVA_OPTS: -Xms256m -Xmx1536m -Duser.timezone=Asia/Shanghai
      ORBIS_AGENT_WORKDIR: ${JENKINS_DATA_ROOT:?}/agent
      ORBIS_REPOSITORY: https://github.com/singous/orbis.git
      ORBIS_SOURCE_REF: ${ORBIS_SOURCE_REF:-develop}
      ORBIS_RUNTIME_DIR: ${ORBIS_RUNTIME_DIR:?}
      ORBIS_ARTIFACT_ROOT: ${JENKINS_DATA_ROOT}/artifacts
      ORBIS_REGISTRY: ${ORBIS_REGISTRY:-127.0.0.1:28210}
      ORBIS_REGISTRY_TRANSPORT: ${ORBIS_REGISTRY_TRANSPORT:-}
      ORBIS_PUSH_CREDENTIAL_ID: ${ORBIS_PUSH_CREDENTIAL_ID:-}
      ORBIS_PULL_CREDENTIAL_ID: ${ORBIS_PULL_CREDENTIAL_ID:-}
      ORBIS_JENKINS_URL: ${JENKINS_PUBLIC_URL:?}
      TZ: Asia/Shanghai
    volumes:
      - ./data/home:/var/jenkins_home
      - ./data/bootstrap:/run/orbis-bootstrap
      - ./init.groovy:/var/jenkins_home/init.groovy.d/orbis.groovy:ro
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 12
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    image: orbis/jenkins-agent:2.580.1
    build:
      context: .
      dockerfile: agent.Dockerfile
    user: "${ORBIS_UID:-1000}:${ORBIS_GID:-1000}"
    group_add:
      - "${DOCKER_GID:?}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ORBIS_AGENT_WORKDIR: ${JENKINS_DATA_ROOT}/agent
      BUILDX_CONFIG: ${JENKINS_DATA_ROOT}/agent/.buildx
      ORBIS_RUNTIME_DIR: ${ORBIS_RUNTIME_DIR}
      ORBIS_ARTIFACT_ROOT: ${JENKINS_DATA_ROOT}/artifacts
      ORBIS_REGISTRY: ${ORBIS_REGISTRY:-127.0.0.1:28210}
      ORBIS_REGISTRY_TRANSPORT: ${ORBIS_REGISTRY_TRANSPORT:-}
      ORBIS_SMOKE_HOST: host.docker.internal
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/bootstrap:/run/orbis-bootstrap:ro
      - ${JENKINS_DATA_ROOT}/agent:${JENKINS_DATA_ROOT}/agent
      - ${JENKINS_DATA_ROOT}/artifacts:${JENKINS_DATA_ROOT}/artifacts
      - ${ORBIS_RUNTIME_DIR}:${ORBIS_RUNTIME_DIR}
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    logging: *logging

  registry:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    user: "${ORBIS_UID:-1000}:${ORBIS_GID:-1000}"
    ports:
      - "127.0.0.1:28210:5000"
    volumes:
      - ./data/registry:/var/lib/registry
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  registry-transport:
    profiles: [harbor]
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    network_mode: host
    environment:
      ORBIS_TRANSPORT_ADDRESS: ${ORBIS_REGISTRY_TRANSPORT:-127.0.0.1:28182}
      ORBIS_HARBOR_UPSTREAM: ${ORBIS_HARBOR_UPSTREAM:-http://127.0.0.1:28181}
    volumes:
      - ./registry-transport.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
