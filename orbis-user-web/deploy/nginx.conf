# Example server for a co-located API on its standard port.
# Serve the same dist build configured by ORBIS_USER_WEB_DIST_DIR in the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application owns upload limits; configure a proxy limit if required.
    client_max_body_size 0;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass http://127.0.0.1:9201/;
        proxy_cache off;
    }

    location = /s {
        proxy_pass http://127.0.0.1:9201;
        proxy_cache off;
    }

    location ^~ /s/ {
        proxy_pass http://127.0.0.1:9201;
        proxy_cache off;
    }

    location ^~ /public/sites/ {
        proxy_pass http://127.0.0.1:9201;
        proxy_cache off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:9201;
        proxy_cache off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
